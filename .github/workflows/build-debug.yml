name: Android Debug Build

# 免签名构建：不需要任何 Secrets，fork 后可直接运行，用于验证能否编译 / 产出可安装的 debug APK。
on:
  push:
    tags:
      - 'debug-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # 锁到 ubuntu-24.04，避开 2026-10-19 后 ubuntu-latest 迁移到 Ubuntu 26 的突变
    runs-on: ubuntu-24.04
    env:
      # 官方 runner 已预装 Android SDK（含 cmdline-tools 与 sdkmanager），无需任何 setup-android action
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # 编译需要 JDK 21（AGP 8.12 要求）
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # 安装 compileSdk 36 平台。
      # 不可用 android-actions/setup-android@v3：它在现代 SDK 上执行 "sdkmanager tools"，
      # 而 tools 包已被 Google 废弃 -> "Failed to find package 'tools'" -> exit 1，job 直接失败。
      # 预装的 sdkmanager 不在 PATH 里，必须用绝对路径调用（直接写 sdkmanager 会 command not found）。
      - name: Install Android platform
        run: |
          set -e
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # 若 latest 目录不存在，退化为取任一已安装版本
          if [ ! -x "$SDKMGR" ]; then
            SDKMGR=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)
          fi
          echo "sdkmanager: $SDKMGR"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          if [ -d "$ANDROID_HOME/platforms/android-36" ]; then
            echo "android-36 已预装，跳过安装"
            ls "$ANDROID_HOME/platforms"
          else
            yes | "$SDKMGR" --licenses > /dev/null || true
            "$SDKMGR" "platforms;android-36"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # debug 无需 keystore / 签名 secrets。
      # 只编最通用的 mobile + arm64-v8a 单 variant：assembleDebug 会同时构建 3mode x 2abi 共 6 个变体，
      # 容易触发内存不足或超时，先保证单变体能过。
      - name: Build debug APK
        run: ./gradlew assembleMobileArm64_v8aDebug --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p dist
          for apk in app/build/outputs/apk/**/debug/*.apk; do
            cp "$apk" dist/ 2>/dev/null || true
          done
          ls -la dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: XMBOX-debug-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error
