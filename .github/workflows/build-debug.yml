name: Android Debug Build

# 免签名构建：不需要任何 Secrets，fork 后可直接运行，用于验证能否编译 / 产出可安装的 debug APK。
on:
  push:
    tags:
      - 'debug-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # 锁到 ubuntu-24.04，避开 2026-10-19 后 ubuntu-latest 迁移到 Ubuntu 26 的突变
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # 编译需要 JDK 21（AGP 8.12 要求）
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # GitHub runner 镜像已预装 Android SDK 与 cmdline-tools，无需额外 setup action。
      # headless 环境下未接受许可会让 sdkmanager 挂起或直接失败，故先批量接受。
      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # debug 无需 keystore / 签名 secrets。
      # 只编最通用的 mobile + arm64-v8a 单 variant：assembleDebug 会同时构建 3mode x 2abi 共 6 个变体，
      # 容易触发内存不足或超时，先保证单变体能过。
      - name: Build debug APK
        run: ./gradlew assembleMobileArm64_v8aDebug --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p dist
          for apk in app/build/outputs/apk/**/debug/*.apk; do
            cp "$apk" dist/ 2>/dev/null || true
          done
          ls -la dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: XMBOX-debug-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error
