name: Android Debug Build

# 免签名构建：不需要任何 Secrets，fork 后可直接运行，用于验证能否编译 / 产出可安装的 debug APK。
on:
  push:
    tags:
      - 'debug-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # 锁到 ubuntu-24.04，避开 2026-10-19 后 ubuntu-latest 迁移到 Ubuntu 26 的突变
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # 编译需要 JDK 21（AGP 8.12 要求）
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # 安装 Android SDK 命令行工具（目前最新 v3，仍跑在 Node 20，仅弃用警告，不影响运行）
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 安装编译所需的 SDK 平台（compileSdk 36）
      - name: Install Android platform
        run: sdkmanager "platforms;android-36"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # debug 构建不需要 keystore / 签名 secrets
      - name: Build debug APKs
        run: ./gradlew assembleDebug --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p dist
          for apk in app/build/outputs/apk/**/debug/*.apk; do
            cp "$apk" dist/ 2>/dev/null || true
          done
          ls -la dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: XMBOX-debug-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error
